name: Docker Build & Push

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: Build the image even if it already exists
        required: false
        default: false
        type: boolean

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'QBITTORRENT_VERSION=\K[^ ]+' Dockerfile | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: extract-version
    uses: aszili/github-actions/.github/workflows/build-docker-image.yml@main
    with:
      target_tag: ${{ needs.extract-version.outputs.version }}
      build_args: QBITTORRENT_VERSION=${{ needs.extract-version.outputs.version }}
      force: ${{ contains(inputs.force, 'true') }}